<!DOCTYPE html>
<html>
<head>
    <title>Q1 Drill 2</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            background-color: #333333;
            color: white;
            width: 80%;
            margin: auto;
            padding: 10px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        p {
            font-size: 18px;
        }

        form {
            background-color: white;
            width: 75%;
            margin: 30px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 3px 10px #cccccc;
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            margin: 10px;
        }

        input[type="text"] {
            width: 85%;
            padding: 15px;
            margin: 15px;
            text-align: center;
            font-size: 16px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin: 10px;
        }

        textarea {
            width: 85%;
            height: 80px;
            margin: 15px;
            padding: 10px;
            text-align: center;
            font-family: monospace;
            font-size: 15px;
        }

        input[type="submit"] {
            width: 88%;
            padding: 15px;
            background-color: #333333;
            color: white;
            border: none;
            font-size: 16px;
        }

        a {
            color: #555555;
        }
    </style>
</head>

<body>

    <h1>RATE A MOVIE</h1>

    <br>

    <label>Share your top pick movie and write a review.</label>

    <form>

        <img src="https://i.pinimg.com/736x/59/3e/c3/593ec3ae6b2dcb01cf89a8667fc9fbc2.jpg" alt="Movie Image">

        <br>

        <input type="text" placeholder="Movie Title">

        <h4>Genres <i>(select all that apply):</i></h4>

        <input type="checkbox"> Horror
        <input type="checkbox"> Action
        <input type="checkbox"> Drama
        <input type="checkbox"> Comedy
        <input type="checkbox"> Sci-Fi

        <h2>Rating:</h2>

        <input type="radio" name="rating">⭐
        <input type="radio" name="rating">⭐⭐
        <input type="radio" name="rating">⭐⭐⭐
        <input type="radio" name="rating">⭐⭐⭐⭐
        <input type="radio" name="rating">⭐⭐⭐⭐⭐

        <br>

        <textarea placeholder="Write your review..."></textarea>

        <br>

        <input type="submit" value="Submit Review">

        <br>

        </form>

        <label>
            Movie Review Tips:
            <a href="https://www.rottentomatoes.com/" target="_blank">Click here!</a>
        </label>

<br>

    </form>

</body>
</html>
